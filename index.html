<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#12172A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Salah</title>
<style>
  :root {
    --bg: #12172A;
    --bg-card: #1B2338;
    --bg-card-raised: #232C45;
    --gold: #C9A66B;
    --gold-dim: #8A7449;
    --text: #F1EDE2;
    --text-muted: #8B93AC;
    --teal: #4F8A82;
    --rust: #B5583F;
    --hairline: rgba(241,237,226,0.09);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  body {
    background-image:
      radial-gradient(circle at 15% -5%, rgba(201,166,107,0.10), transparent 45%),
      radial-gradient(circle at 100% 10%, rgba(79,138,130,0.10), transparent 40%);
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }
  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--gold);
    text-align: center;
    margin: 0 0 6px;
  }
  h1.brand {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 30px;
    text-align: center;
    margin: 0 0 28px;
    letter-spacing: 0.02em;
    font-weight: 400;
  }
  .brand em { color: var(--gold); font-style: normal; }

  .date-line {
    text-align: center;
    font-size: 13px;
    color: var(--text-muted);
    margin: -18px 0 22px;
    line-height: 1.45;
  }
  .date-line[hidden] { display: none; }

  .offline-banner {
    background: rgba(181, 88, 63, 0.12);
    border: 1px solid rgba(181, 88, 63, 0.35);
    color: var(--rust);
    font-size: 12.5px;
    text-align: center;
    padding: 10px 14px;
    border-radius: 12px;
    margin-bottom: 14px;
    line-height: 1.4;
  }
  .offline-banner[hidden] { display: none; }

  .pull-hint {
    text-align: center;
    font-size: 11px;
    color: var(--text-muted);
    margin: -6px 0 10px;
    opacity: 0;
    transition: opacity 0.15s ease;
  }
  .pull-hint.visible { opacity: 1; }

  /* ---- state screens ---- */
  .state-card {
    background: var(--bg-card);
    border: 1px solid var(--hairline);
    border-radius: 18px;
    padding: 36px 24px;
    text-align: center;
  }
  .state-card p { color: var(--text-muted); line-height: 1.55; margin: 10px 0 22px; font-size: 14.5px; }
  .btn {
    appearance: none;
    border: none;
    background: var(--gold);
    color: #1B1508;
    font-size: 15px;
    font-weight: 600;
    padding: 13px 26px;
    border-radius: 999px;
    cursor: pointer;
    letter-spacing: 0.01em;
  }
  .btn:active { transform: scale(0.98); }
  .btn.secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--hairline);
  }
  .error-text { color: var(--rust); font-size: 13.5px; margin-top: 14px; }

  /* ---- hero: next prayer ---- */
  .hero {
    position: relative;
    background: linear-gradient(165deg, var(--bg-card-raised), var(--bg-card));
    border: 1px solid var(--hairline);
    border-radius: 20px;
    padding: 30px 24px 26px;
    overflow: hidden;
    margin-bottom: 16px;
  }
  .hero-star {
    position: absolute;
    top: -60px; right: -60px;
    width: 200px; height: 200px;
    opacity: 0.06;
  }
  .hero-label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--text-muted); margin: 0; }
  .hero-name-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 4px 0 2px;
  }
  .hero-name {
    font-family: Georgia, serif;
    font-size: 44px;
    margin: 0;
    color: var(--gold);
    position: relative;
  }
  .hero-tomorrow {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--teal);
    padding: 4px 10px;
    border: 1px solid rgba(79,138,130,0.45);
    border-radius: 999px;
  }
  .hero-tomorrow[hidden] { display: none; }
  .hero-time { font-size: 17px; color: var(--text); margin: 0 0 2px; }
  .hero-countdown { font-size: 13.5px; color: var(--text-muted); margin: 0; }
  .hero-loc { font-size: 12px; color: var(--text-muted); margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--hairline); display: flex; justify-content: space-between; align-items: center; }
  .hero-loc button {
    background: none; border: none; color: var(--gold); font-size: 12px; cursor: pointer; padding: 0;
  }
  .hero-loc .place-sub { font-size: 11px; opacity: 0.75; }
  .hero-loc button:disabled { opacity: 0.6; cursor: default; }

  /* ---- today list ---- */
  .list-card {
    background: var(--bg-card);
    border: 1px solid var(--hairline);
    border-radius: 20px;
    padding: 6px 6px;
    margin-bottom: 16px;
  }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 13px 16px;
    border-radius: 12px;
  }
  .row.active { background: rgba(201,166,107,0.12); }
  .row-name { font-size: 15px; }
  .row-name .arabic { color: var(--text-muted); font-size: 12.5px; margin-left: 6px; }
  .row-time { font-size: 15px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .row.active .row-time { color: var(--gold); font-weight: 600; }
  .row.past .row-name, .row.past .row-time { color: var(--text-muted); opacity: 0.5; }

  /* ---- qibla ---- */
  .qibla-card {
    background: var(--bg-card);
    border: 1px solid var(--hairline);
    border-radius: 20px;
    padding: 24px 20px 26px;
    text-align: center;
  }
  .qibla-title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--text-muted); margin: 0 0 18px; }
  .compass-frame { position: relative; width: 220px; height: 220px; margin: 0 auto 16px; }
  .compass-ring {
    width: 100%; height: 100%;
    border-radius: 50%;
    border: 1px solid var(--hairline);
    background: radial-gradient(circle at 50% 50%, var(--bg-card-raised), var(--bg-card) 72%);
    position: relative;
    transition: transform 0.2s ease;
  }
  .compass-tick { position: absolute; left: 50%; top: 50%; width: 1px; height: 108px; background: var(--hairline); transform-origin: top left; }
  .compass-n {
    position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
    font-size: 11px; color: var(--text-muted); letter-spacing: 0.08em;
  }
  .needle {
    position: absolute; left: 50%; top: 50%;
    width: 0; height: 0;
    transform-origin: 0 0;
  }
  .needle svg { position: absolute; left: -22px; top: -92px; width: 44px; height: 92px; }
  .compass-center {
    position: absolute; left: 50%; top: 50%; width: 14px; height: 14px;
    margin: -7px 0 0 -7px; border-radius: 50%; background: var(--gold);
    box-shadow: 0 0 0 4px var(--bg-card);
  }
  .qibla-deg { font-family: Georgia, serif; font-size: 22px; color: var(--gold); margin: 4px 0 2px; }
  .qibla-sub { font-size: 13px; color: var(--text-muted); margin: 0; line-height: 1.5; }
  .qibla-permission { margin-top: 16px; }

  .reminders-card {
    background: var(--bg-card);
    border: 1px solid var(--hairline);
    border-radius: 20px;
    padding: 24px 20px 26px;
    text-align: center;
    margin-top: 16px;
  }
  .reminders-note {
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.5;
    margin: 14px 0 0;
  }
  .reminders-actions { margin-top: 16px; }

  .top-settings {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 8px 12px;
    margin: -8px 0 16px;
  }
  .top-settings .setting-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .top-settings label {
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
  }
  .top-settings .check-label {
    text-transform: none;
    letter-spacing: 0;
    font-size: 12.5px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .top-settings input[type="checkbox"] {
    accent-color: var(--gold);
    width: 15px;
    height: 15px;
  }
  select {
    background: var(--bg-card-raised);
    color: var(--text);
    border: 1px solid var(--hairline);
    border-radius: 10px;
    padding: 8px 10px;
    font-size: 12.5px;
  }

  footer { text-align: center; margin-top: 28px; font-size: 11.5px; color: var(--text-muted); opacity: 0.7; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Prayer times, on demand</p>
  <h1 class="brand">Sal<em>a</em>h</h1>
  <p class="date-line" id="date-line" hidden></p>
  <p class="pull-hint" id="pull-hint">Pull down to refresh location</p>

  <div id="app">
    <div class="state-card" id="start-card">
      <p>Uses your phone's actual location, right now — no account, no ads.</p>
      <button class="btn" id="locate-btn">Find my location</button>
      <div id="start-error"></div>
    </div>
  </div>

  <footer>Prayer times via AlAdhan · Qibla calculated from your GPS position</footer>
</div>

<script>
(function() {
  const KAABA_LAT = 21.4225;
  const KAABA_LON = 39.8262;
  const PRAYERS = ["Fajr", "Dhuhr", "Asr", "Maghrib", "Isha"];
  const ARABIC = { Fajr: "الفجر", Dhuhr: "الظهر", Asr: "العصر", Maghrib: "المغرب", Isha: "العشاء", Sunrise: "الشروق" };
  const METHOD_KEY = 'salah-calc-method';
  const SCHOOL_KEY = 'salah-asr-school';
  const SUNRISE_KEY = 'salah-show-sunrise';
  const CACHE_KEY = 'salah-offline-cache';
  const REMINDERS_KEY = 'salah-reminders-enabled';
  const ADHAN_KEY = 'salah-play-adhan';
  const ADHAN_SRC = 'assets/adhan.mp3';

  const app = document.getElementById('app');
  let currentMethod = 2;
  let currentSchool = 0;
  let showSunrise = false;
  let remindersEnabled = false;
  let playAdhanSound = true;
  let adhanAudio = null;
  let lastAdhanAlarmId = '';
  let userCoords = null;
  let qiblaBearing = null;
  let orientationActive = false;
  let cachedTimings = null;
  let timingsDate = null;
  let tomorrowTimings = null;
  let dateInfo = null;
  let timezoneLabel = null;
  let isOfflineView = false;
  let tickInterval = null;
  let secondInterval = null;
  let wakeDebounce = null;
  let touchStartY = 0;
  let pullDistance = 0;

  function loadMethodPref() {
    try {
      const v = localStorage.getItem(METHOD_KEY);
      if (v) currentMethod = parseInt(v, 10);
    } catch (e) {}
  }
  function saveMethodPref(val) {
    try { localStorage.setItem(METHOD_KEY, String(val)); } catch (e) {}
  }
  function loadSchoolPref() {
    try {
      const v = localStorage.getItem(SCHOOL_KEY);
      if (v) currentSchool = parseInt(v, 10);
    } catch (e) {}
  }
  function saveSchoolPref(val) {
    try { localStorage.setItem(SCHOOL_KEY, String(val)); } catch (e) {}
  }
  function loadSunrisePref() {
    try { showSunrise = localStorage.getItem(SUNRISE_KEY) === '1'; } catch (e) {}
  }
  function saveSunrisePref(val) {
    try { localStorage.setItem(SUNRISE_KEY, val ? '1' : '0'); } catch (e) {}
  }
  function loadRemindersPref() {
    try { remindersEnabled = localStorage.getItem(REMINDERS_KEY) === '1'; } catch (e) {}
  }
  function saveRemindersPref(val) {
    try { localStorage.setItem(REMINDERS_KEY, val ? '1' : '0'); } catch (e) {}
  }
  function loadAdhanPref() {
    try {
      const v = localStorage.getItem(ADHAN_KEY);
      if (v !== null) playAdhanSound = v === '1';
    } catch (e) {}
  }
  function saveAdhanPref(val) {
    try { localStorage.setItem(ADHAN_KEY, val ? '1' : '0'); } catch (e) {}
  }

  loadMethodPref();
  loadSchoolPref();
  loadSunrisePref();
  loadRemindersPref();
  loadAdhanPref();

  function localDateString(d = new Date()) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  function formatCountdownMs(ms) {
    if (ms === null || ms < 0) return 'tomorrow';
    const totalSec = Math.floor(ms / 1000);
    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const s = totalSec % 60;
    if (h > 0) return `in ${h}h ${m}m ${s}s`;
    if (m > 0) return `in ${m}m ${s}s`;
    return `in ${s}s`;
  }

  function humanizeTimezone(tz) {
    if (!tz) return null;
    const part = tz.split('/').pop();
    return part ? part.replace(/_/g, ' ') : tz;
  }

  function formatDateLine(info) {
    if (!info) return '';
    const g = info.gregorian;
    const h = info.hijri;
    const greg = `${g.weekday.en}, ${g.day} ${g.month.en} ${g.year}`;
    const hijri = `${h.day} ${h.month.en} ${h.year}`;
    return `${greg} · ${hijri}`;
  }

  function updateDateLine() {
    const el = document.getElementById('date-line');
    if (!el) return;
    if (dateInfo) {
      el.textContent = formatDateLine(dateInfo);
      el.removeAttribute('hidden');
    } else {
      el.setAttribute('hidden', '');
    }
  }

  function saveOfflineCache() {
    if (!cachedTimings || !userCoords) return;
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify({
        timingsDate,
        timings: cachedTimings,
        dateInfo,
        timezone: timezoneLabel,
        method: currentMethod,
        school: currentSchool,
        lat: userCoords.lat,
        lon: userCoords.lon,
        cachedAt: new Date().toISOString()
      }));
    } catch (e) {}
  }

  function loadOfflineCache() {
    try {
      const raw = localStorage.getItem(CACHE_KEY);
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (e) { return null; }
  }

  function applyOfflineCache(cache) {
    userCoords = { lat: cache.lat, lon: cache.lon };
    cachedTimings = cache.timings;
    timingsDate = cache.timingsDate;
    dateInfo = cache.dateInfo;
    timezoneLabel = cache.timezone || null;
    currentMethod = cache.method ?? currentMethod;
    currentSchool = cache.school ?? currentSchool;
    tomorrowTimings = null;
    isOfflineView = true;
    qiblaBearing = bearingToQibla(userCoords.lat, userCoords.lon);
    updateDateLine();
  }

  function setOfflineBanner(show, text) {
    const banner = document.getElementById('offline-banner');
    if (!banner) return;
    if (show) {
      banner.textContent = text;
      banner.removeAttribute('hidden');
    } else {
      banner.setAttribute('hidden', '');
    }
  }

  function listPrayerOrder() {
    const list = ['Fajr'];
    if (showSunrise) list.push('Sunrise');
    return list.concat(['Dhuhr', 'Asr', 'Maghrib', 'Isha']);
  }

  async function registerServiceWorker() {
    if (!('serviceWorker' in navigator)) return null;
    try {
      return await navigator.serviceWorker.register('sw.js');
    } catch (e) {
      return null;
    }
  }

  function buildAlarmPayload() {
    if (!cachedTimings || !timingsDate || !remindersEnabled) return null;
    const today = new Date();
    const alarms = PRAYERS.map((p) => {
      const f = fmtTime(cachedTimings[p]);
      const fireAt = new Date(today.getFullYear(), today.getMonth(), today.getDate(), f.hours, f.minutes).getTime();
      return { prayer: p, fireAt };
    });
    return {
      enabled: remindersEnabled,
      playAdhan: playAdhanSound,
      date: timingsDate,
      alarms
    };
  }

  async function syncRemindersToSW() {
    if (!('serviceWorker' in navigator)) return;
    try {
      const reg = await navigator.serviceWorker.ready;
      const sw = reg.active;
      if (!sw) return;
      const payload = buildAlarmPayload();
      if (!payload) {
        sw.postMessage({ type: 'CLEAR' });
      } else {
        sw.postMessage({ type: 'SCHEDULE', payload });
      }
      sw.postMessage({ type: 'CHECK_NOW' });
    } catch (e) {}
  }

  function playAdhan(alarmId) {
    if (!playAdhanSound) return;
    if (alarmId && lastAdhanAlarmId === alarmId) return;
    if (alarmId) lastAdhanAlarmId = alarmId;
    try {
      if (!adhanAudio) {
        adhanAudio = new Audio(ADHAN_SRC);
        adhanAudio.preload = 'auto';
      }
      adhanAudio.currentTime = 0;
      adhanAudio.play().catch(() => {});
    } catch (e) {}
  }

  async function enableReminders() {
    if (!('Notification' in window)) return;
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') return;
    remindersEnabled = true;
    saveRemindersPref(true);
    await registerServiceWorker();
    await syncRemindersToSW();
    if (cachedTimings) render(cachedTimings);
  }

  async function disableReminders() {
    remindersEnabled = false;
    saveRemindersPref(false);
    await syncRemindersToSW();
    if (cachedTimings) render(cachedTimings);
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.addEventListener('message', (event) => {
      if (event.data?.type === 'PLAY_ADHAN') {
        playAdhan(event.data.alarmId);
      }
    });
  }

  function bearingToQibla(lat, lon) {
    const toRad = d => d * Math.PI / 180;
    const toDeg = r => r * 180 / Math.PI;
    const lat1 = toRad(lat), lat2 = toRad(KAABA_LAT);
    const dLon = toRad(KAABA_LON - lon);
    const y = Math.sin(dLon) * Math.cos(lat2);
    const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon);
    return (toDeg(Math.atan2(y, x)) + 360) % 360;
  }

  function fmtTime(t) {
    const clean = t.split(' ')[0];
    const [h, m] = clean.split(':').map(Number);
    const period = h >= 12 ? 'PM' : 'AM';
    const h12 = ((h + 11) % 12) + 1;
    return { display: `${h12}:${String(m).padStart(2,'0')} ${period}`, hours: h, minutes: m };
  }

  function renderError(targetId, msg) {
    const el = document.getElementById(targetId);
    if (el) el.innerHTML = `<p class="error-text">${msg}</p>`;
  }

  function resetRefreshBtn() {
    const btn = document.getElementById('refresh-loc');
    if (btn) {
      btn.textContent = 'Refresh location';
      btn.disabled = false;
    }
  }

  function locate(opts = {}) {
    const silent = opts.silent;
    const startBtn = document.getElementById('locate-btn');
    const startError = document.getElementById('start-error');
    const refreshBtn = document.getElementById('refresh-loc');

    if (startBtn) {
      startBtn.textContent = 'Locating…';
      startBtn.disabled = true;
    }
    if (refreshBtn) {
      refreshBtn.textContent = 'Updating…';
      refreshBtn.disabled = true;
    }
    if (startError) startError.innerHTML = '';
    if (silent && !document.getElementById('hero-name')) {
      app.innerHTML = `<div class="state-card"><p>Loading prayer times…</p></div>`;
    }

    if (!navigator.geolocation) {
      if (!silent && startError) {
        renderError('start-error', "This browser doesn't support location access. Try opening this page in your phone's browser instead.");
      } else if (silent) showStartCard();
      if (startBtn) { startBtn.textContent = 'Find my location'; startBtn.disabled = false; }
      resetRefreshBtn();
      return;
    }

    navigator.geolocation.getCurrentPosition(
      (pos) => {
        isOfflineView = false;
        userCoords = { lat: pos.coords.latitude, lon: pos.coords.longitude };
        tomorrowTimings = null;
        cachedTimings = null;
        timingsDate = null;
        loadAndRender();
      },
      async (err) => {
        if (silent) {
          const cache = loadOfflineCache();
          if (cache) {
            applyOfflineCache(cache);
            const readable = cache.dateInfo?.readable || cache.timingsDate;
            render(cachedTimings);
            setOfflineBanner(true, `Offline — showing saved times from ${readable}`);
            startTicker();
            startSecondTicker();
            await refreshPrayerState();
            await syncRemindersToSW();
            resetRefreshBtn();
            if (startBtn) { startBtn.textContent = 'Find my location'; startBtn.disabled = false; }
            return;
          }
          showStartCard();
        } else {
          let msg = "Couldn't get your location.";
          if (err.code === err.PERMISSION_DENIED) {
            msg = "Location access was denied. Enable location for this page in your browser settings, then try again.";
          } else if (err.code === err.TIMEOUT) {
            msg = "Location lookup timed out. Try again — GPS can be slow indoors.";
          }
          if (startError) renderError('start-error', msg);
        }
        if (startBtn) { startBtn.textContent = 'Find my location'; startBtn.disabled = false; }
        resetRefreshBtn();
      },
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 }
    );
  }

  function showStartCard() {
    app.innerHTML = `
      <div class="state-card" id="start-card">
        <p>Uses your phone's actual location, right now — no account, no ads.</p>
        <button class="btn" id="locate-btn">Find my location</button>
        <div id="start-error"></div>
      </div>`;
    document.getElementById('locate-btn').onclick = () => locate();
  }

  async function fetchDayData(lat, lon, method, school, date = new Date()) {
    const dd = String(date.getDate()).padStart(2, '0');
    const mm = String(date.getMonth() + 1).padStart(2, '0');
    const yyyy = date.getFullYear();
    const url = `https://api.aladhan.com/v1/timings/${dd}-${mm}-${yyyy}?latitude=${lat}&longitude=${lon}&method=${method}&school=${school}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('network');
    const data = await res.json();
    if (data.code !== 200) throw new Error('api');
    return {
      timings: data.data.timings,
      dateInfo: data.data.date,
      timezone: data.data.meta?.timezone
    };
  }

  async function fetchTomorrowTimings() {
    const tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    const data = await fetchDayData(userCoords.lat, userCoords.lon, currentMethod, currentSchool, tomorrow);
    return data.timings;
  }

  async function loadAndRender() {
    const hasMainUi = document.getElementById('hero-name');
    if (!hasMainUi) {
      app.innerHTML = `<div class="state-card"><p>Fetching today's times…</p></div>`;
    }
    try {
      const data = await fetchDayData(userCoords.lat, userCoords.lon, currentMethod, currentSchool);
      cachedTimings = data.timings;
      dateInfo = data.dateInfo;
      timezoneLabel = humanizeTimezone(data.timezone);
      timingsDate = localDateString();
      tomorrowTimings = null;
      isOfflineView = false;
      qiblaBearing = bearingToQibla(userCoords.lat, userCoords.lon);
      saveOfflineCache();
      updateDateLine();
      render(cachedTimings);
      setOfflineBanner(false);
      startTicker();
      startSecondTicker();
      resetRefreshBtn();
      await syncRemindersToSW();
      await refreshPrayerState();
    } catch (e) {
      const cache = loadOfflineCache();
      if (cache) {
        applyOfflineCache(cache);
        const readable = cache.dateInfo?.readable || cache.timingsDate;
        render(cachedTimings);
        setOfflineBanner(true, `Offline — showing saved times from ${readable}`);
        startTicker();
        startSecondTicker();
        resetRefreshBtn();
        await syncRemindersToSW();
        await refreshPrayerState();
        return;
      }
      stopTicker();
      stopSecondTicker();
      resetRefreshBtn();
      app.innerHTML = `<div class="state-card">
        <p>Couldn't reach the prayer times service. Check your connection and try again.</p>
        <button class="btn" id="retry-btn">Retry</button>
      </div>`;
      document.getElementById('retry-btn').onclick = loadAndRender;
    }
  }

  function computeNext(timings) {
    const now = new Date();
    let next = null, nextMinutes = Infinity;
    const parsed = {};
    PRAYERS.forEach(p => {
      const f = fmtTime(timings[p]);
      parsed[p] = f;
      const pDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), f.hours, f.minutes);
      const diffMin = (pDate - now) / 60000;
      if (diffMin >= 0 && diffMin < nextMinutes) { nextMinutes = diffMin; next = p; }
    });
    const allPassed = !next;
    if (allPassed) {
      next = 'Fajr';
      nextMinutes = null;
    }
    return { next, nextMinutes, parsed, allPassed };
  }

  function getNextRemainingMs() {
    if (!cachedTimings) return null;
    const now = new Date();
    const { next, nextMinutes, parsed, allPassed } = computeNext(cachedTimings);
    if (!allPassed) {
      const f = parsed[next];
      const target = new Date(now.getFullYear(), now.getMonth(), now.getDate(), f.hours, f.minutes);
      return target - now;
    }
    if (tomorrowTimings) {
      const f = fmtTime(tomorrowTimings.Fajr);
      const target = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, f.hours, f.minutes);
      return target - now;
    }
    return null;
  }

  function getHeroDisplay() {
    const { next, parsed, allPassed } = computeNext(cachedTimings);
    if (!allPassed) {
      const ms = getNextRemainingMs();
      return {
        next,
        timeDisplay: parsed[next].display,
        countdownText: formatCountdownMs(ms),
        showTomorrow: false
      };
    }
    if (tomorrowTimings) {
      const f = fmtTime(tomorrowTimings.Fajr);
      const ms = getNextRemainingMs();
      return {
        next: 'Fajr',
        timeDisplay: f.display,
        countdownText: formatCountdownMs(ms),
        showTomorrow: true
      };
    }
    return {
      next: 'Fajr',
      timeDisplay: '',
      countdownText: 'tomorrow',
      showTomorrow: true
    };
  }

  function placeDisplayHtml() {
    const place = timezoneLabel;
    const coords = `${userCoords.lat.toFixed(3)}, ${userCoords.lon.toFixed(3)}`;
    if (place) {
      return `<span><strong>${place}</strong><br><span class="place-sub">${coords}</span></span>`;
    }
    return `<span>${coords}</span>`;
  }

  function updateHeroCountdown() {
    const heroCountdown = document.getElementById('hero-countdown');
    if (!heroCountdown || !cachedTimings) return;
    const ms = getNextRemainingMs();
    heroCountdown.textContent = ms === null ? 'tomorrow' : formatCountdownMs(ms);
  }

  function updateHeroAndList() {
    if (!cachedTimings || !document.getElementById('hero-name')) return;

    const hero = getHeroDisplay();
    const heroName = document.getElementById('hero-name');
    const heroTomorrow = document.getElementById('hero-tomorrow');
    const heroTime = document.getElementById('hero-time');
    const heroCountdown = document.getElementById('hero-countdown');

    heroName.textContent = hero.next;
    if (heroTomorrow) {
      if (hero.showTomorrow) heroTomorrow.removeAttribute('hidden');
      else heroTomorrow.setAttribute('hidden', '');
    }
    if (heroTime) {
      heroTime.textContent = hero.timeDisplay;
      heroTime.style.display = hero.timeDisplay ? '' : 'none';
    }
    if (heroCountdown) heroCountdown.textContent = hero.countdownText;

    const now = new Date();
    const { next, allPassed, parsed } = computeNext(cachedTimings);
    listPrayerOrder().forEach(p => {
      const rowId = p === 'Sunrise' ? 'row-sunrise' : 'row-' + p.toLowerCase();
      const row = document.getElementById(rowId);
      if (!row) return;
      const f = parsed[p] || fmtTime(cachedTimings[p]);
      const pDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), f.hours, f.minutes);
      const isActive = !allPassed && p === next;
      const isPast = allPassed || (pDate < now && !isActive);
      row.className = 'row' + (isActive ? ' active' : '') + (isPast ? ' past' : '');
    });
  }

  async function refreshPrayerState() {
    if (!userCoords || !cachedTimings) return;

    const today = localDateString();
    if (today !== timingsDate && !isOfflineView) {
      tomorrowTimings = null;
      try {
        const data = await fetchDayData(userCoords.lat, userCoords.lon, currentMethod, currentSchool);
        cachedTimings = data.timings;
        dateInfo = data.dateInfo;
        timezoneLabel = humanizeTimezone(data.timezone);
        timingsDate = today;
        isOfflineView = false;
        qiblaBearing = bearingToQibla(userCoords.lat, userCoords.lon);
        saveOfflineCache();
        updateDateLine();
        render(cachedTimings);
        setOfflineBanner(false);
        startTicker();
        startSecondTicker();
        await syncRemindersToSW();
      } catch (e) {
        updateHeroAndList();
        updateHeroCountdown();
        return;
      }
    }

    const { allPassed } = computeNext(cachedTimings);
    if (allPassed && !tomorrowTimings && !isOfflineView) {
      try {
        tomorrowTimings = await fetchTomorrowTimings();
      } catch (e) {}
    }
    updateHeroAndList();
    updateHeroCountdown();
  }

  function startTicker() {
    stopTicker();
    if (!cachedTimings) return;
    tickInterval = setInterval(() => {
      if (document.visibilityState === 'visible') refreshPrayerState();
    }, 60000);
  }

  function stopTicker() {
    if (tickInterval) {
      clearInterval(tickInterval);
      tickInterval = null;
    }
  }

  function startSecondTicker() {
    stopSecondTicker();
    if (!cachedTimings) return;
    secondInterval = setInterval(() => {
      if (document.visibilityState === 'visible') updateHeroCountdown();
    }, 1000);
  }

  function stopSecondTicker() {
    if (secondInterval) {
      clearInterval(secondInterval);
      secondInterval = null;
    }
  }

  function onWake() {
    if (wakeDebounce) clearTimeout(wakeDebounce);
    wakeDebounce = setTimeout(async () => {
      wakeDebounce = null;
      await refreshPrayerState();
      if (remindersEnabled) await syncRemindersToSW();
      if (document.visibilityState === 'visible') {
        startTicker();
        startSecondTicker();
      }
    }, 300);
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') onWake();
    else { stopTicker(); stopSecondTicker(); }
  });
  window.addEventListener('pageshow', onWake);
  window.addEventListener('focus', onWake);

  function setupPullToRefresh() {
    const hint = document.getElementById('pull-hint');
    document.addEventListener('touchstart', (e) => {
      if (!document.getElementById('hero-name')) return;
      if (window.scrollY > 5) return;
      touchStartY = e.touches[0].clientY;
      pullDistance = 0;
    }, { passive: true });
    document.addEventListener('touchmove', (e) => {
      if (!document.getElementById('hero-name')) return;
      if (touchStartY === 0) return;
      const dy = e.touches[0].clientY - touchStartY;
      if (dy > 0 && window.scrollY <= 5) {
        pullDistance = dy;
        if (hint) hint.classList.toggle('visible', dy > 30);
      }
    }, { passive: true });
    document.addEventListener('touchend', () => {
      if (pullDistance > 70 && document.getElementById('hero-name')) locate();
      pullDistance = 0;
      touchStartY = 0;
      if (hint) hint.classList.remove('visible');
    });
  }
  setupPullToRefresh();

  function starSVG() {
    return `<svg class="hero-star" viewBox="0 0 100 100"><path fill="#C9A66B" d="M50 2 L61 39 L98 39 L68 61 L79 98 L50 75 L21 98 L32 61 L2 39 L39 39 Z"/></svg>`;
  }

  function applyStaticCompass() {
    const ring = document.getElementById('compass-ring');
    const needle = document.getElementById('needle');
    if (!ring || !needle) return;
    if (orientationActive) {
      ring.style.transform = 'rotate(0deg)';
    } else {
      ring.style.transform = `rotate(${-qiblaBearing}deg)`;
      needle.style.transform = 'rotate(0deg)';
    }
  }

  function render(timings) {
    const { next, nextMinutes, parsed, allPassed } = computeNext(timings);
    const ms = getNextRemainingMs();
    const hero = allPassed
      ? { next: 'Fajr', timeDisplay: '', countdownText: ms === null ? 'tomorrow' : formatCountdownMs(ms), showTomorrow: true }
      : {
          next,
          timeDisplay: parsed[next].display,
          countdownText: formatCountdownMs(ms !== null ? ms : nextMinutes * 60000),
          showTomorrow: false
        };

    let rowsHTML = '';
    const now = new Date();
    listPrayerOrder().forEach(p => {
      const f = p === 'Sunrise' ? fmtTime(timings.Sunrise) : parsed[p];
      const pDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), f.hours, f.minutes);
      const isActive = !allPassed && p === next;
      const isPast = allPassed || (pDate < now && !isActive);
      const rowId = p === 'Sunrise' ? 'row-sunrise' : 'row-' + p.toLowerCase();
      const arabic = ARABIC[p] || '';
      rowsHTML += `<div class="row ${isActive ? 'active' : ''} ${isPast ? 'past' : ''}" id="${rowId}" data-prayer="${p}">
        <div class="row-name">${p}<span class="arabic">${arabic}</span></div>
        <div class="row-time">${f.display}</div>
      </div>`;
    });

    const compassEnabled = orientationActive;
    const compassBtnText = compassEnabled ? 'Compass enabled' : 'Enable live compass';
    const compassBtnDisabled = compassEnabled ? 'disabled' : '';
    const offlineBanner = isOfflineView
      ? `<div class="offline-banner" id="offline-banner">Offline — showing saved times</div>`
      : `<div class="offline-banner" id="offline-banner" hidden></div>`;

    app.innerHTML = `
      ${offlineBanner}
      <div class="top-settings">
        <div class="setting-group">
          <label for="method-select">Method</label>
          <select id="method-select"></select>
        </div>
        <div class="setting-group">
          <label for="school-select">Asr</label>
          <select id="school-select"></select>
        </div>
        <div class="setting-group">
          <label class="check-label">
            <input type="checkbox" id="sunrise-toggle" ${showSunrise ? 'checked' : ''}>
            Show Sunrise
          </label>
        </div>
      </div>

      <div class="hero">
        ${starSVG()}
        <p class="hero-label">Next prayer</p>
        <div class="hero-name-wrap">
          <div class="hero-name" id="hero-name">${hero.next}</div>
          <span class="hero-tomorrow" id="hero-tomorrow" ${hero.showTomorrow ? '' : 'hidden'}>Tomorrow</span>
        </div>
        <p class="hero-time" id="hero-time" ${hero.timeDisplay ? '' : 'style="display:none"'}>${hero.timeDisplay}</p>
        <p class="hero-countdown" id="hero-countdown">${hero.countdownText}</p>
        <div class="hero-loc">
          ${placeDisplayHtml()}
          <button id="refresh-loc">Refresh location</button>
        </div>
      </div>

      <div class="list-card">${rowsHTML}</div>

      <div class="qibla-card">
        <p class="qibla-title">Qibla direction</p>
        <div class="compass-frame" id="compass-frame">
          <div class="compass-ring" id="compass-ring">
            <div class="compass-n">N</div>
          </div>
          <div class="needle" id="needle">
            <svg viewBox="0 0 44 92"><path d="M22 0 L34 66 L22 54 L10 66 Z" fill="#C9A66B"/></svg>
          </div>
          <div class="compass-center"></div>
        </div>
        <p class="qibla-deg">${Math.round(qiblaBearing)}°</p>
        <p class="qibla-sub" id="qibla-sub">${compassEnabled ? 'point the top of your phone toward the gold arrow' : "from true north — tap below to enable your phone's compass"}</p>
        <div class="qibla-permission">
          <button class="btn secondary" id="enable-compass" ${compassBtnDisabled}>${compassBtnText}</button>
        </div>
      </div>

      <div class="reminders-card">
        <p class="qibla-title">Prayer reminders</p>
        ${remindersEnabled ? `
          <label class="check-label" style="justify-content:center;margin-bottom:12px;">
            <input type="checkbox" id="adhan-toggle" ${playAdhanSound ? 'checked' : ''}>
            Play Adhan sound
          </label>
          <p class="reminders-note">Notifications at each prayer time. Adhan plays when Salah is open; tap the notification to open and hear Adhan. Works best from your home screen — on iPhone, reminders may be less reliable than native apps.</p>
          <div class="reminders-actions">
            <button class="btn secondary" id="disable-reminders">Turn off reminders</button>
          </div>
        ` : `
          <p class="reminders-note">Get notified at Fajr, Dhuhr, Asr, Maghrib, and Isha. Add Salah to your home screen for the best experience.</p>
          <div class="reminders-actions">
            <button class="btn" id="enable-reminders">Enable prayer reminders</button>
          </div>
        `}
      </div>
    `;

    document.getElementById('refresh-loc').onclick = () => locate();
    const compassBtn = document.getElementById('enable-compass');
    if (!compassEnabled) compassBtn.onclick = enableCompass;
    setupMethodSelect();
    setupSchoolSelect();
    setupSunriseToggle();
    setupRemindersUI();
    applyStaticCompass();
  }

  function setupRemindersUI() {
    const enableBtn = document.getElementById('enable-reminders');
    if (enableBtn) enableBtn.onclick = () => enableReminders();

    const disableBtn = document.getElementById('disable-reminders');
    if (disableBtn) disableBtn.onclick = () => disableReminders();

    const adhanCb = document.getElementById('adhan-toggle');
    if (adhanCb) {
      adhanCb.onchange = async () => {
        playAdhanSound = adhanCb.checked;
        saveAdhanPref(playAdhanSound);
        await syncRemindersToSW();
      };
    }
  }

  function setupMethodSelect() {
    const methods = [
      [2, "ISNA (North America)"],
      [3, "Muslim World League"],
      [4, "Umm al-Qura (Makkah)"],
      [1, "Karachi"],
      [5, "Egyptian Authority"]
    ];
    const sel = document.getElementById('method-select');
    if (!sel) return;
    sel.innerHTML = methods.map(([id, label]) =>
      `<option value="${id}" ${id === currentMethod ? 'selected' : ''}>${label}</option>`).join('');
    sel.onchange = () => {
      currentMethod = parseInt(sel.value, 10);
      saveMethodPref(currentMethod);
      tomorrowTimings = null;
      isOfflineView = false;
      loadAndRender();
    };
  }

  function setupSchoolSelect() {
    const schools = [
      [0, "Shafi"],
      [1, "Hanafi"]
    ];
    const sel = document.getElementById('school-select');
    if (!sel) return;
    sel.innerHTML = schools.map(([id, label]) =>
      `<option value="${id}" ${id === currentSchool ? 'selected' : ''}>${label}</option>`).join('');
    sel.onchange = () => {
      currentSchool = parseInt(sel.value, 10);
      saveSchoolPref(currentSchool);
      tomorrowTimings = null;
      isOfflineView = false;
      loadAndRender();
    };
  }

  function setupSunriseToggle() {
    const cb = document.getElementById('sunrise-toggle');
    if (!cb) return;
    cb.onchange = () => {
      showSunrise = cb.checked;
      saveSunrisePref(showSunrise);
      if (cachedTimings) render(cachedTimings);
    };
  }

  function rotateNeedle(headingRelativeToDevice) {
    const needle = document.getElementById('needle');
    if (needle) needle.style.transform = `rotate(${headingRelativeToDevice}deg)`;
  }

  function handleOrientation(event) {
    let compassHeading;
    if (typeof event.webkitCompassHeading === 'number') {
      compassHeading = event.webkitCompassHeading;
    } else if (event.absolute && event.alpha !== null) {
      compassHeading = (360 - event.alpha) % 360;
    } else {
      return;
    }
    const relative = (qiblaBearing - compassHeading + 360) % 360;
    rotateNeedle(relative);
    const sub = document.getElementById('qibla-sub');
    if (sub) sub.textContent = 'point the top of your phone toward the gold arrow';
  }

  async function enableCompass() {
    const btn = document.getElementById('enable-compass');
    try {
      if (typeof DeviceOrientationEvent !== 'undefined' &&
          typeof DeviceOrientationEvent.requestPermission === 'function') {
        const perm = await DeviceOrientationEvent.requestPermission();
        if (perm !== 'granted') {
          document.getElementById('qibla-sub').textContent = 'Compass permission denied — arrow shows direction from true north instead.';
          return;
        }
      }
      window.addEventListener('deviceorientationabsolute', handleOrientation, true);
      window.addEventListener('deviceorientation', handleOrientation, true);
      orientationActive = true;
      applyStaticCompass();
      btn.textContent = 'Compass enabled';
      btn.disabled = true;
    } catch (e) {
      document.getElementById('qibla-sub').textContent = "Couldn't access the compass on this device. Arrow shows direction from true north.";
    }
  }

  const locateBtn = document.getElementById('locate-btn');
  if (locateBtn) locateBtn.onclick = () => locate();

  async function tryAutoLocate() {
    if (remindersEnabled) await registerServiceWorker();
    if (!navigator.geolocation) return;
    try {
      if (navigator.permissions) {
        const status = await navigator.permissions.query({ name: 'geolocation' });
        if (status.state === 'granted') {
          locate({ silent: true });
          return;
        }
      }
    } catch (e) {}
  }
  tryAutoLocate();
})();
</script>
</body>
</html>
