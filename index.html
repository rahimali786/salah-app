<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#12172A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Salah</title>
<style>
  :root {
    --bg: #12172A;
    --bg-card: #1B2338;
    --bg-card-raised: #232C45;
    --gold: #C9A66B;
    --gold-dim: #8A7449;
    --text: #F1EDE2;
    --text-muted: #8B93AC;
    --teal: #4F8A82;
    --rust: #B5583F;
    --hairline: rgba(241,237,226,0.09);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  body {
    background-image:
      radial-gradient(circle at 15% -5%, rgba(201,166,107,0.10), transparent 45%),
      radial-gradient(circle at 100% 10%, rgba(79,138,130,0.10), transparent 40%);
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }
  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--gold);
    text-align: center;
    margin: 0 0 6px;
  }
  h1.brand {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 30px;
    text-align: center;
    margin: 0 0 28px;
    letter-spacing: 0.02em;
    font-weight: 400;
  }
  .brand em { color: var(--gold); font-style: normal; }

  /* ---- state screens ---- */
  .state-card {
    background: var(--bg-card);
    border: 1px solid var(--hairline);
    border-radius: 18px;
    padding: 36px 24px;
    text-align: center;
  }
  .state-card p { color: var(--text-muted); line-height: 1.55; margin: 10px 0 22px; font-size: 14.5px; }
  .btn {
    appearance: none;
    border: none;
    background: var(--gold);
    color: #1B1508;
    font-size: 15px;
    font-weight: 600;
    padding: 13px 26px;
    border-radius: 999px;
    cursor: pointer;
    letter-spacing: 0.01em;
  }
  .btn:active { transform: scale(0.98); }
  .btn.secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--hairline);
  }
  .error-text { color: var(--rust); font-size: 13.5px; margin-top: 14px; }

  /* ---- hero: next prayer ---- */
  .hero {
    position: relative;
    background: linear-gradient(165deg, var(--bg-card-raised), var(--bg-card));
    border: 1px solid var(--hairline);
    border-radius: 20px;
    padding: 30px 24px 26px;
    overflow: hidden;
    margin-bottom: 16px;
  }
  .hero-star {
    position: absolute;
    top: -60px; right: -60px;
    width: 200px; height: 200px;
    opacity: 0.06;
  }
  .hero-label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--text-muted); margin: 0; }
  .hero-name-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 4px 0 2px;
  }
  .hero-name {
    font-family: Georgia, serif;
    font-size: 44px;
    margin: 0;
    color: var(--gold);
    position: relative;
  }
  .hero-tomorrow {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--teal);
    padding: 4px 10px;
    border: 1px solid rgba(79,138,130,0.45);
    border-radius: 999px;
  }
  .hero-tomorrow[hidden] { display: none; }
  .hero-time { font-size: 17px; color: var(--text); margin: 0 0 2px; }
  .hero-countdown { font-size: 13.5px; color: var(--text-muted); margin: 0; }
  .hero-loc { font-size: 12px; color: var(--text-muted); margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--hairline); display: flex; justify-content: space-between; align-items: center; }
  .hero-loc button {
    background: none; border: none; color: var(--gold); font-size: 12px; cursor: pointer; padding: 0;
  }

  /* ---- today list ---- */
  .list-card {
    background: var(--bg-card);
    border: 1px solid var(--hairline);
    border-radius: 20px;
    padding: 6px 6px;
    margin-bottom: 16px;
  }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 13px 16px;
    border-radius: 12px;
  }
  .row.active { background: rgba(201,166,107,0.12); }
  .row-name { font-size: 15px; }
  .row-name .arabic { color: var(--text-muted); font-size: 12.5px; margin-left: 6px; }
  .row-time { font-size: 15px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .row.active .row-time { color: var(--gold); font-weight: 600; }
  .row.past .row-name, .row.past .row-time { color: var(--text-muted); opacity: 0.5; }

  /* ---- qibla ---- */
  .qibla-card {
    background: var(--bg-card);
    border: 1px solid var(--hairline);
    border-radius: 20px;
    padding: 24px 20px 26px;
    text-align: center;
  }
  .qibla-title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--text-muted); margin: 0 0 18px; }
  .compass-frame { position: relative; width: 220px; height: 220px; margin: 0 auto 16px; }
  .compass-ring {
    width: 100%; height: 100%;
    border-radius: 50%;
    border: 1px solid var(--hairline);
    background: radial-gradient(circle at 50% 50%, var(--bg-card-raised), var(--bg-card) 72%);
    position: relative;
  }
  .compass-tick { position: absolute; left: 50%; top: 50%; width: 1px; height: 108px; background: var(--hairline); transform-origin: top left; }
  .compass-n {
    position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
    font-size: 11px; color: var(--text-muted); letter-spacing: 0.08em;
  }
  .needle {
    position: absolute; left: 50%; top: 50%;
    width: 0; height: 0;
    transform-origin: 0 0;
  }
  .needle svg { position: absolute; left: -22px; top: -92px; width: 44px; height: 92px; }
  .compass-center {
    position: absolute; left: 50%; top: 50%; width: 14px; height: 14px;
    margin: -7px 0 0 -7px; border-radius: 50%; background: var(--gold);
    box-shadow: 0 0 0 4px var(--bg-card);
  }
  .qibla-deg { font-family: Georgia, serif; font-size: 22px; color: var(--gold); margin: 4px 0 2px; }
  .qibla-sub { font-size: 13px; color: var(--text-muted); margin: 0; line-height: 1.5; }
  .qibla-permission { margin-top: 16px; }

  .top-settings {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin: -8px 0 16px;
  }
  .top-settings label {
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
  }
  select {
    background: var(--bg-card-raised);
    color: var(--text);
    border: 1px solid var(--hairline);
    border-radius: 10px;
    padding: 8px 10px;
    font-size: 12.5px;
  }

  footer { text-align: center; margin-top: 28px; font-size: 11.5px; color: var(--text-muted); opacity: 0.7; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Prayer times, on demand</p>
  <h1 class="brand">Sal<em>a</em>h</h1>

  <div id="app">
    <div class="state-card" id="start-card">
      <p>Uses your phone's actual location, right now — no account, no ads.</p>
      <button class="btn" id="locate-btn">Find my location</button>
      <div id="start-error"></div>
    </div>
  </div>

  <footer>Prayer times via AlAdhan · Qibla calculated from your GPS position</footer>
</div>

<script>
(function() {
  const KAABA_LAT = 21.4225;
  const KAABA_LON = 39.8262;
  const PRAYERS = ["Fajr", "Dhuhr", "Asr", "Maghrib", "Isha"];
  const ARABIC = { Fajr: "الفجر", Dhuhr: "الظهر", Asr: "العصر", Maghrib: "المغرب", Isha: "العشاء" };
  const METHOD_KEY = 'salah-calc-method';

  const app = document.getElementById('app');
  let currentMethod = 2; // ISNA default
  let userCoords = null;
  let qiblaBearing = null;
  let orientationActive = false;
  let cachedTimings = null;
  let timingsDate = null;
  let tomorrowTimings = null;
  let tickInterval = null;
  let wakeDebounce = null;

  function loadMethodPref() {
    try {
      const v = localStorage.getItem(METHOD_KEY);
      if (v) currentMethod = parseInt(v, 10);
    } catch (e) { /* private mode / blocked */ }
  }
  function saveMethodPref(val) {
    try { localStorage.setItem(METHOD_KEY, String(val)); } catch (e) {}
  }
  loadMethodPref();

  function localDateString(d = new Date()) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  function formatCountdown(minutes) {
    if (minutes === null || minutes < 0) return 'tomorrow';
    const h = Math.floor(minutes / 60);
    const m = Math.round(minutes % 60);
    return h > 0 ? `in ${h}h ${m}m` : `in ${m}m`;
  }

  function bearingToQibla(lat, lon) {
    const toRad = d => d * Math.PI / 180;
    const toDeg = r => r * 180 / Math.PI;
    const lat1 = toRad(lat), lat2 = toRad(KAABA_LAT);
    const dLon = toRad(KAABA_LON - lon);
    const y = Math.sin(dLon) * Math.cos(lat2);
    const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon);
    return (toDeg(Math.atan2(y, x)) + 360) % 360;
  }

  function fmtTime(t) {
    // API gives "HH:MM" (24h) sometimes with suffix; convert to 12h display
    const clean = t.split(' ')[0];
    const [h, m] = clean.split(':').map(Number);
    const period = h >= 12 ? 'PM' : 'AM';
    const h12 = ((h + 11) % 12) + 1;
    return { display: `${h12}:${String(m).padStart(2,'0')} ${period}`, hours: h, minutes: m };
  }

  function renderError(targetId, msg) {
    document.getElementById(targetId).innerHTML =
      `<p class="error-text">${msg}</p>`;
  }

  async function locate() {
    const startBtn = document.getElementById('locate-btn');
    const startError = document.getElementById('start-error');
    if (startBtn) {
      startBtn.textContent = 'Locating…';
      startBtn.disabled = true;
    }
    if (startError) startError.innerHTML = '';

    if (!navigator.geolocation) {
      if (startError) {
        renderError('start-error', "This browser doesn't support location access. Try opening this page in your phone's browser instead.");
      }
      if (startBtn) {
        startBtn.textContent = 'Find my location';
        startBtn.disabled = false;
      }
      return;
    }

    navigator.geolocation.getCurrentPosition(
      (pos) => {
        userCoords = { lat: pos.coords.latitude, lon: pos.coords.longitude };
        tomorrowTimings = null;
        cachedTimings = null;
        timingsDate = null;
        loadAndRender();
      },
      (err) => {
        let msg = "Couldn't get your location.";
        if (err.code === err.PERMISSION_DENIED) {
          msg = "Location access was denied. Enable location for this page in your browser settings, then try again.";
        } else if (err.code === err.TIMEOUT) {
          msg = "Location lookup timed out. Try again — GPS can be slow indoors.";
        }
        if (startError) renderError('start-error', msg);
        if (startBtn) {
          startBtn.textContent = 'Find my location';
          startBtn.disabled = false;
        }
      },
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 }
    );
  }

  async function fetchTimings(lat, lon, method, date = new Date()) {
    const dd = String(date.getDate()).padStart(2, '0');
    const mm = String(date.getMonth() + 1).padStart(2, '0');
    const yyyy = date.getFullYear();
    const url = `https://api.aladhan.com/v1/timings/${dd}-${mm}-${yyyy}?latitude=${lat}&longitude=${lon}&method=${method}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('network');
    const data = await res.json();
    if (data.code !== 200) throw new Error('api');
    return data.data.timings;
  }

  async function fetchTomorrowTimings() {
    const tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    return fetchTimings(userCoords.lat, userCoords.lon, currentMethod, tomorrow);
  }

  async function loadAndRender() {
    const hasMainUi = document.getElementById('hero-name');
    if (!hasMainUi) {
      app.innerHTML = `<div class="state-card"><p>Fetching today's times…</p></div>`;
    }
    try {
      const timings = await fetchTimings(userCoords.lat, userCoords.lon, currentMethod);
      cachedTimings = timings;
      timingsDate = localDateString();
      tomorrowTimings = null;
      qiblaBearing = bearingToQibla(userCoords.lat, userCoords.lon);
      render(timings);
      startTicker();
      await refreshPrayerState();
    } catch (e) {
      stopTicker();
      app.innerHTML = `<div class="state-card">
        <p>Couldn't reach the prayer times service. Check your connection and try again.</p>
        <button class="btn" id="retry-btn">Retry</button>
      </div>`;
      document.getElementById('retry-btn').onclick = loadAndRender;
    }
  }

  function computeNext(timings) {
    const now = new Date();
    let next = null, nextMinutes = Infinity;
    const parsed = {};
    PRAYERS.forEach(p => {
      const f = fmtTime(timings[p]);
      parsed[p] = f;
      const pDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), f.hours, f.minutes);
      const diffMin = (pDate - now) / 60000;
      if (diffMin >= 0 && diffMin < nextMinutes) { nextMinutes = diffMin; next = p; }
    });
    const allPassed = !next;
    if (allPassed) {
      next = 'Fajr';
      nextMinutes = null;
    }
    return { next, nextMinutes, parsed, allPassed };
  }

  function getHeroDisplay() {
    const { next, nextMinutes, parsed, allPassed } = computeNext(cachedTimings);
    if (!allPassed) {
      return {
        next,
        timeDisplay: parsed[next].display,
        countdownText: formatCountdown(nextMinutes),
        showTomorrow: false
      };
    }
    if (tomorrowTimings) {
      const f = fmtTime(tomorrowTimings.Fajr);
      const tomorrowDate = new Date();
      tomorrowDate.setDate(tomorrowDate.getDate() + 1);
      tomorrowDate.setHours(f.hours, f.minutes, 0, 0);
      const diffMin = (tomorrowDate - new Date()) / 60000;
      return {
        next: 'Fajr',
        timeDisplay: f.display,
        countdownText: formatCountdown(diffMin),
        showTomorrow: true
      };
    }
    return {
      next: 'Fajr',
      timeDisplay: '',
      countdownText: 'tomorrow',
      showTomorrow: true
    };
  }

  function updateHeroAndList() {
    if (!cachedTimings || !document.getElementById('hero-name')) return;

    const hero = getHeroDisplay();
    const heroName = document.getElementById('hero-name');
    const heroTomorrow = document.getElementById('hero-tomorrow');
    const heroTime = document.getElementById('hero-time');
    const heroCountdown = document.getElementById('hero-countdown');

    heroName.textContent = hero.next;
    if (heroTomorrow) {
      if (hero.showTomorrow) heroTomorrow.removeAttribute('hidden');
      else heroTomorrow.setAttribute('hidden', '');
    }
    if (heroTime) {
      heroTime.textContent = hero.timeDisplay;
      heroTime.style.display = hero.timeDisplay ? '' : 'none';
    }
    if (heroCountdown) heroCountdown.textContent = hero.countdownText;

    const now = new Date();
    const { next, allPassed, parsed } = computeNext(cachedTimings);
    PRAYERS.forEach(p => {
      const row = document.getElementById('row-' + p.toLowerCase());
      if (!row) return;
      const f = parsed[p];
      const pDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), f.hours, f.minutes);
      const isActive = !allPassed && p === next;
      const isPast = allPassed || (pDate < now && !isActive);
      row.className = 'row' + (isActive ? ' active' : '') + (isPast ? ' past' : '');
    });
  }

  async function refreshPrayerState() {
    if (!userCoords || !cachedTimings) return;

    const today = localDateString();
    if (today !== timingsDate) {
      tomorrowTimings = null;
      try {
        const timings = await fetchTimings(userCoords.lat, userCoords.lon, currentMethod);
        cachedTimings = timings;
        timingsDate = today;
        qiblaBearing = bearingToQibla(userCoords.lat, userCoords.lon);
        render(timings);
        startTicker();
      } catch (e) {
        updateHeroAndList();
        return;
      }
    }

    const { allPassed } = computeNext(cachedTimings);
    if (allPassed && !tomorrowTimings) {
      try {
        tomorrowTimings = await fetchTomorrowTimings();
      } catch (e) { /* keep fallback hero */ }
    }
    updateHeroAndList();
  }

  function startTicker() {
    stopTicker();
    if (!cachedTimings) return;
    tickInterval = setInterval(() => {
      if (document.visibilityState === 'visible') refreshPrayerState();
    }, 60000);
  }

  function stopTicker() {
    if (tickInterval) {
      clearInterval(tickInterval);
      tickInterval = null;
    }
  }

  function onWake() {
    if (wakeDebounce) clearTimeout(wakeDebounce);
    wakeDebounce = setTimeout(() => {
      wakeDebounce = null;
      refreshPrayerState();
      if (document.visibilityState === 'visible') startTicker();
    }, 300);
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') onWake();
    else stopTicker();
  });
  window.addEventListener('pageshow', onWake);
  window.addEventListener('focus', onWake);

  function starSVG() {
    return `<svg class="hero-star" viewBox="0 0 100 100"><path fill="#C9A66B" d="M50 2 L61 39 L98 39 L68 61 L79 98 L50 75 L21 98 L32 61 L2 39 L39 39 Z"/></svg>`;
  }

  function render(timings) {
    const { next, nextMinutes, parsed, allPassed } = computeNext(timings);
    const hero = allPassed
      ? { next: 'Fajr', timeDisplay: '', countdownText: 'tomorrow', showTomorrow: true }
      : {
          next,
          timeDisplay: parsed[next].display,
          countdownText: formatCountdown(nextMinutes),
          showTomorrow: false
        };

    let rowsHTML = '';
    const now = new Date();
    PRAYERS.forEach(p => {
      const f = parsed[p];
      const pDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), f.hours, f.minutes);
      const isActive = !allPassed && p === next;
      const isPast = allPassed || (pDate < now && !isActive);
      rowsHTML += `<div class="row ${isActive ? 'active' : ''} ${isPast ? 'past' : ''}" id="row-${p.toLowerCase()}" data-prayer="${p}">
        <div class="row-name">${p}<span class="arabic">${ARABIC[p]}</span></div>
        <div class="row-time">${f.display}</div>
      </div>`;
    });

    const compassEnabled = orientationActive;
    const compassBtnText = compassEnabled ? 'Compass enabled' : 'Enable live compass';
    const compassBtnDisabled = compassEnabled ? 'disabled' : '';

    app.innerHTML = `
      <div class="top-settings">
        <label for="method-select">Calculation method</label>
        <select id="method-select"></select>
      </div>

      <div class="hero">
        ${starSVG()}
        <p class="hero-label">Next prayer</p>
        <div class="hero-name-wrap">
          <div class="hero-name" id="hero-name">${hero.next}</div>
          <span class="hero-tomorrow" id="hero-tomorrow" ${hero.showTomorrow ? '' : 'hidden'}>Tomorrow</span>
        </div>
        <p class="hero-time" id="hero-time" ${hero.timeDisplay ? '' : 'style="display:none"'}>${hero.timeDisplay}</p>
        <p class="hero-countdown" id="hero-countdown">${hero.countdownText}</p>
        <div class="hero-loc">
          <span>${userCoords.lat.toFixed(3)}, ${userCoords.lon.toFixed(3)}</span>
          <button id="refresh-loc">Refresh location</button>
        </div>
      </div>

      <div class="list-card">${rowsHTML}</div>

      <div class="qibla-card">
        <p class="qibla-title">Qibla direction</p>
        <div class="compass-frame" id="compass-frame">
          <div class="compass-ring">
            <div class="compass-n">N</div>
          </div>
          <div class="needle" id="needle">
            <svg viewBox="0 0 44 92"><path d="M22 0 L34 66 L22 54 L10 66 Z" fill="#C9A66B"/></svg>
          </div>
          <div class="compass-center"></div>
        </div>
        <p class="qibla-deg">${Math.round(qiblaBearing)}°</p>
        <p class="qibla-sub" id="qibla-sub">${compassEnabled ? 'point the top of your phone toward the gold arrow' : "from true north — tap below to enable your phone's compass"}</p>
        <div class="qibla-permission">
          <button class="btn secondary" id="enable-compass" ${compassBtnDisabled}>${compassBtnText}</button>
        </div>
      </div>
    `;

    document.getElementById('refresh-loc').onclick = locate;
    const compassBtn = document.getElementById('enable-compass');
    if (!compassEnabled) compassBtn.onclick = enableCompass;
    setupMethodSelect();
  }

  function setupMethodSelect() {
    const methods = [
      [2, "ISNA (North America)"],
      [3, "Muslim World League"],
      [4, "Umm al-Qura (Makkah)"],
      [1, "Karachi"],
      [5, "Egyptian Authority"]
    ];
    const sel = document.getElementById('method-select');
    sel.innerHTML = methods.map(([id, label]) =>
      `<option value="${id}" ${id === currentMethod ? 'selected' : ''}>${label}</option>`).join('');
    sel.onchange = () => {
      currentMethod = parseInt(sel.value, 10);
      saveMethodPref(currentMethod);
      tomorrowTimings = null;
      loadAndRender();
    };
  }

  function rotateNeedle(headingRelativeToDevice) {
    const needle = document.getElementById('needle');
    if (needle) needle.style.transform = `rotate(${headingRelativeToDevice}deg)`;
  }

  function handleOrientation(event) {
    let compassHeading;
    if (typeof event.webkitCompassHeading === 'number') {
      compassHeading = event.webkitCompassHeading; // iOS: 0 = North, clockwise
    } else if (event.absolute && event.alpha !== null) {
      compassHeading = (360 - event.alpha) % 360; // Android absolute orientation approx
    } else {
      return; // no usable heading
    }
    const relative = (qiblaBearing - compassHeading + 360) % 360;
    rotateNeedle(relative);
    const sub = document.getElementById('qibla-sub');
    if (sub) sub.textContent = 'point the top of your phone toward the gold arrow';
  }

  async function enableCompass() {
    const btn = document.getElementById('enable-compass');
    try {
      if (typeof DeviceOrientationEvent !== 'undefined' &&
          typeof DeviceOrientationEvent.requestPermission === 'function') {
        const perm = await DeviceOrientationEvent.requestPermission();
        if (perm !== 'granted') {
          document.getElementById('qibla-sub').textContent = 'Compass permission denied — arrow shows direction from true north instead.';
          return;
        }
      }
      window.addEventListener('deviceorientationabsolute', handleOrientation, true);
      window.addEventListener('deviceorientation', handleOrientation, true);
      orientationActive = true;
      btn.textContent = 'Compass enabled';
      btn.disabled = true;
    } catch (e) {
      document.getElementById('qibla-sub').textContent = "Couldn't access the compass on this device. Arrow shows direction from true north.";
    }
  }

  document.getElementById('locate-btn').onclick = locate;
})();
</script>
</body>
